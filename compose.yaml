version: "3.8"

services:
  postgres:
    container_name: bidderx
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=bidderx'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=qliky'
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  postgres_data:
    driver: local
