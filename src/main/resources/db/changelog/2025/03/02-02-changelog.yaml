databaseChangeLog:
  - changeSet:
      id: 1740917682
      author: QLIKY
      changes:
        - addColumn:
            tableName: wallets
            columns:
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false


  - changeSet:
      id: 1740917687
      author: QLIKY
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: wallet_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: wallet_id
            constraintName: fk_transactions_wallets
            referencedTableName: wallets
            referencedColumnNames: id